[project]
name = "tracemind-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "langchain-core>=0.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
