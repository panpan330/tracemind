server:
  port: ${INVENTORY_SERVICE_PORT:8082}
spring:
  application:
    name: inventory-service
  datasource:
    url: ${BUSINESS_DB_URL:jdbc:mysql://localhost:3306/tracemind_business?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sessionVariables=innodb_lock_wait_timeout%3D10}
    username: ${BUSINESS_DB_USER:app_business}
    password: ${BUSINESS_DB_PASSWORD:app_business_pwd}
management:
  server:
    port: ${INVENTORY_MANAGEMENT_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      service: inventory-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s
