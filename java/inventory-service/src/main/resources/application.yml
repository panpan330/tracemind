server:
  port: ${INVENTORY_SERVICE_PORT:8082}
spring:
  application:
    name: inventory-service
  datasource:
    url: ${BUSINESS_DB_URL:jdbc:mysql://localhost:3306/tracemind_business?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sessionVariables=innodb_lock_wait_timeout%3D10}
    username: ${BUSINESS_DB_USER:app_business}
    password: ${BUSINESS_DB_PASSWORD:app_business_pwd}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
