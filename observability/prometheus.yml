global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
rule_files:
  - /etc/prometheus/prometheus-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: tracemind-java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:9081", "inventory-service:9082"]
