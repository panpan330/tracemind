# TraceMind demo 告警规则(V2.1-A):统一表面症状 OrderOperationP95High。
# 阈值为 demo 初始值(P95 > 100ms 持续 15s),按方案需以真实压测校准后再调整。
groups:
  - name: tracemind-demo
    rules:
      - alert: OrderOperationP95High
        expr: >-
          histogram_quantile(0.95, sum by (le) (
            rate(http_server_requests_seconds_bucket{service="order-service",uri="/api/orders/{orderId}/check-stock"}[15s])
          )) > 0.1
        for: 15s
        labels:
          service: order-service
          operation: ORDER_CREATE
          environment: demo
        annotations:
          summary: "order-service ORDER_CREATE P95 above 100ms for 15s"
