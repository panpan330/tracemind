# TraceMind 一键编排:MySQL 8 + order/inventory + AI 服务 + 前端工作台
# 用法: docker compose up -d --build && docker compose ps
# 基底文件名统一为 compose.yml(设计 §2.2/§2.4);CI 叠加 compose.ci.yml。
services:
  mysql:
    image: mysql:8.0.39   # 固定 Patch 版本
    container_name: tracemind-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd_2026
      MYSQL_DATABASE: tracemind_business
      # V2.0-A:demo MySQL 时区与 CI/应用统一为 UTC(naive UTC 存储语义)
      TZ: UTC
    command:
      - --innodb-buffer-pool-size=64M
      - --innodb-flush-log-at-trx-commit=2
      - --performance-schema=ON
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行:建库/四账号/业务表/控制库 13 表(全部幂等)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_pwd_2026 --silent"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    networks: [tracemind, control-data-network, tool-observation-network]

  # V2.0-A:一次性数据库初始化(建库 + Schema 迁移 + 账号 Provisioning,官方迁移器)。
  # 替代已废弃的 initdb 目录挂载;幂等,重复 up 安全。
  db-init:
    image: python:3.12-slim
    container_name: tracemind-db-init
    environment:
      TRACEMIND_MIGRATE_DB_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root_pwd_2026}@mysql:3306/"
      # 账号密码:本地 demo 默认值;CI 由 Job Env 注入覆盖(compose.ci.yml)
      TRACEMIND_DB_CONTROL_APP_PASSWORD: ${TRACEMIND_DB_CONTROL_APP_PASSWORD:-control_app_pwd}
      TRACEMIND_DB_APP_BUSINESS_PASSWORD: ${TRACEMIND_DB_APP_BUSINESS_PASSWORD:-app_business_pwd}
      TRACEMIND_DB_AI_INVESTIGATOR_PASSWORD: ${TRACEMIND_DB_AI_INVESTIGATOR_PASSWORD:-investigator_pwd}
      TRACEMIND_DB_FIX_EXECUTOR_PASSWORD: ${TRACEMIND_DB_FIX_EXECUTOR_PASSWORD:-fix_executor_pwd}
      TRACEMIND_DB_SESSION_TERMINATOR_PASSWORD: ${TRACEMIND_DB_SESSION_TERMINATOR_PASSWORD:-terminator_pwd}
      TRACEMIND_DB_MCP_AUDITOR_PASSWORD: ${TRACEMIND_DB_MCP_AUDITOR_PASSWORD:-mcp_auditor_pwd}
    command:
      - sh
      - -c
      - "sed -i 's|deb.debian.org|mirrors.aliyun.com|g' /etc/apt/sources.list.d/debian.sources && apt-get update -qq && apt-get install -y -qq default-mysql-client >/dev/null && pip install -q -i https://mirrors.aliyun.com/pypi/simple/ pymysql && python /work/scripts/db/migrate.py --init-db --migrations /work/scripts/db/migrations && python /work/scripts/db/migrate.py --migrations /work/scripts/db/migrations && python /work/scripts/db/migrate.py --provision --migrations /work/scripts/db/migrations"
    volumes:
      - ./scripts/db:/work/scripts/db:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks: [control-data-network]

  # 一次性灌压测数据(幂等:已有数据则跳过);容器正常退出
  seed:
    image: python:3.12-slim
    container_name: tracemind-seed
    environment:
      BUSINESS_DB_URL: "mysql:3306/tracemind_business"
      BUSINESS_DB_USER: app_business
      BUSINESS_DB_PASSWORD: app_business_pwd
      INVENTORY_ROWS: "500000"
    command: ["sh", "-c", "pip install -q -i https://mirrors.aliyun.com/pypi/simple/ pymysql && python /seed/seed_data.py"]
    volumes:
      - ./scripts/seed_data.py:/seed/seed_data.py:ro
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [tracemind]

  order-service:
    build:
      context: ./java
      dockerfile: order-service/Dockerfile
    container_name: tracemind-order
    environment:
      ORDER_SERVICE_PORT: "8081"
      BUSINESS_DB_URL: "jdbc:mysql://mysql:3306/tracemind_business?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      BUSINESS_DB_USER: app_business
      BUSINESS_DB_PASSWORD: app_business_pwd
      INVENTORY_SERVICE_URL: "http://inventory-service:8082"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    networks: [tracemind, metrics-scrape-net, trace-ingest-net, tool-observation-network]

  inventory-service:
    build:
      context: ./java
      dockerfile: inventory-service/Dockerfile
    container_name: tracemind-inventory
    environment:
      INVENTORY_SERVICE_PORT: "8082"
      BUSINESS_DB_URL: "jdbc:mysql://mysql:3306/tracemind_business?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      BUSINESS_DB_USER: app_business
      BUSINESS_DB_PASSWORD: app_business_pwd
      DEMO_MODE: "true"
      DEMO_KEY: demo-secret-2026
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    networks: [tracemind, metrics-scrape-net, trace-ingest-net, tool-observation-network]

  ai-service:
    image: tracemind-ai-service:${TRACEMIND_IMAGE_SHA:-latest}
    build:
      context: ./ai-service
    container_name: tracemind-ai
    # 密钥(LLM/Embedding API Key)走 VM 本地 .env.vm,不进 git
    env_file:
      - .env.vm
    environment:
      TRACEMIND_CONTROL_DB_URL: "mysql+pymysql://tracemind_control_app:control_app_pwd@mysql:3306/tracemind_control"
      TRACEMIND_READONLY_DB_URL: "mysql+pymysql://ai_investigator:investigator_pwd@mysql:3306/tracemind_business"
      # 会话终止专用账号(缺省时 session_terminator 回退只读引擎,无法 KILL → 处置 500);不带库名:KILL 只需 PROCESS+CONNECTION_ADMIN
      TRACEMIND_SESSION_TERMINATOR_DB_URL: "mysql+pymysql://session_terminator:terminator_pwd@mysql:3306/"
      TRACEMIND_ORDER_SERVICE_URL: "http://order-service:8081"
      TRACEMIND_INVENTORY_SERVICE_URL: "http://inventory-service:8082"
      TRACEMIND_DEMO_MODE: "true"
      TRACEMIND_DEMO_KEY: demo-secret-2026
      # V2.1-A:Alertmanager webhook Bearer token(demo 占位;CI/真实部署注入)
      TRACEMIND_ALERTMANAGER_WEBHOOK_TOKEN: ${TRACEMIND_ALERTMANAGER_WEBHOOK_TOKEN:-demo-am-token-2026}
      TRACEMIND_LLM_MODE: fake
      TRACEMIND_EVAL_CHAT_MODEL: qwen3.7-max
      # V1.7:MCP 经独立 mcp-tools 服务(Streamable HTTP 标准部署)
      TRACEMIND_MCP_TRANSPORT: "streamable_http"
      TRACEMIND_MCP_HTTP_URL: "http://mcp-tools:8001/mcp"
      TRACEMIND_MCP_HTTP_BEARER_TOKEN: "${TRACEMIND_MCP_HTTP_BEARER_TOKEN:-}"
      # 真实模型验收:LLM_MODE=real_strict + RAG_MODE=required + 启动 qdrant 服务(见 README)
      TRACEMIND_RAG_MODE: off
      TRACEMIND_EVAL_MODE: "true"
      TRACEMIND_QDRANT_URL: "http://qdrant:6333"
      TRACEMIND_EMBEDDING_MODEL: text-embedding-v4
      TRACEMIND_EMBEDDING_DIMENSIONS: "1024"
      # V1.4 可观测性:调查数据源经 mcp-tools(标准 HTTP 模式,ai 不直连观测后端)
      TRACEMIND_METRICS_BACKEND: fixture
      TRACEMIND_TRACE_BACKEND: fixture
    ports:
      - "8000:8000"
    volumes:
      - ai-checkpoints:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      mcp-tools:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [tracemind, agent-mcp-network, control-data-network, llm-egress-network]

  mcp-tools:
    image: tracemind-mcp-tools:${TRACEMIND_IMAGE_SHA:-latest}
    build:
      context: ./ai-service
      target: mcp-tools-runtime
    container_name: tracemind-mcp-tools
    # 独立 MCP 工具服务:只读调查 + 最小审计写;不含 LLM/处置凭据
    environment:
      TRACEMIND_MCP_TRANSPORT: "streamable_http"
      TRACEMIND_MCP_HTTP_URL: "http://0.0.0.0:8001/mcp"
      TRACEMIND_MCP_AUTH_CLIENTS_FILE: "/run/secrets/mcp_clients.json"
      TRACEMIND_MCP_AUDIT_DB_URL: "mysql+pymysql://mcp_tool_auditor:${TRACEMIND_DB_MCP_AUDITOR_PASSWORD:-mcp_auditor_pwd}@mysql:3306/tracemind_control"
      # control 连接也用 mcp_tool_auditor 最小权限(观测审计/读 incident;非 control_app 完整权限)
      TRACEMIND_CONTROL_DB_URL: "mysql+pymysql://mcp_tool_auditor:${TRACEMIND_DB_MCP_AUDITOR_PASSWORD:-mcp_auditor_pwd}@mysql:3306/tracemind_control"
      TRACEMIND_READONLY_DB_URL: "mysql+pymysql://ai_investigator:investigator_pwd@mysql:3306/tracemind_business"
      # 调查数据源(标准 HTTP 部署切 prometheus/jaeger 真实后端)
      TRACEMIND_METRICS_BACKEND: "prometheus"
      TRACEMIND_TRACE_BACKEND: "jaeger"
      TRACEMIND_PROMETHEUS_URL: "http://prometheus:9090"
      TRACEMIND_JAEGER_QUERY_ENDPOINT: "jaeger:16685"
      TRACEMIND_METRICS_MAX_AGE_SECONDS: "120"
    secrets:
      - mcp_clients.json
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 256m
    # 只加入内部网络,不映射宿主机端口,不进 LLM 出口网络
    networks: [agent-mcp-network, control-data-network, tool-observation-network]
    restart: unless-stopped

  web:
    build:
      context: ./web
    container_name: tracemind-web
    ports:
      - "8080:80"
    depends_on:
      ai-service:
        condition: service_healthy
    networks: [tracemind]

  # ---- V1.4 可观测性栈(固定版本;Grafana UI 用 profile observability-ui 显式开启)----
  otel-collector:
    image: otel/opentelemetry-collector:0.119.0
    container_name: tracemind-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    mem_limit: 192m
    networks: [trace-ingest-net]

  jaeger:
    image: jaegertracing/jaeger:2.6.0
    container_name: tracemind-jaeger
    environment:
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "10000"
      COLLECTOR_OTLP_ENABLED: "true"
    mem_limit: 512m
    # V2.1:核心 Jaeger 随完整 demo 启动(不再依赖 observability-ui profile,
    # 避免 UI profile 未开时真实 Trace 工具不可用);Grafana UI 仍保持可选
    ports:
      - "127.0.0.1:16686:16686"   # UI 仅宿主机回环;gRPC QueryService 16685 只入 observability-query-net
    networks: [trace-ingest-net, observability-query-net, tool-observation-network]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tracemind-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    networks: [metrics-scrape-net, observability-query-net, tool-observation-network]

  # V2.1-A:Alertmanager(告警 → Incident Gateway webhook)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tracemind-alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [metrics-scrape-net, tracemind]
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.5.0
    container_name: tracemind-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tracemind-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    profiles: [observability-ui]
    ports:
      - "127.0.0.1:3000:3000"     # UI 仅宿主机回环
    mem_limit: 256m
    networks: [observability-query-net]

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: tracemind-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 512m
    networks: [tracemind]

volumes:
  mysql-data:
  ai-checkpoints:
  prometheus-data:
  grafana-data:
  qdrant-data:

secrets:
  mcp_clients.json:
    file: ./secrets/mcp_clients.json

networks:
  tracemind:
    driver: bridge
  metrics-scrape-net:
    driver: bridge
  trace-ingest-net:
    driver: bridge
  observability-query-net:
    driver: bridge
  # ---- V1.7:内部网络(仅 Compose 内部可达)+ LLM 出口(仅 ai-service)----
  agent-mcp-network:
    internal: true
  control-data-network:
    internal: true
  tool-observation-network:
    internal: true
  llm-egress-network:
    driver: bridge
