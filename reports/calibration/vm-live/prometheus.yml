global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
rule_files:
  - /etc/prom/prometheus-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
scrape_configs:
  - job_name: tracemind-java
    metrics_path: /actuator/prometheus
    # 混合拓扑:Java 服务在宿主机(192.168.88.1),经 SSH 反向隧道映射到 VM 回环
    static_configs:
      - targets: ["127.0.0.1:9081", "127.0.0.1:9082"]
